<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Branding Styles matched exactly to index.html -->
    <style>
      .bg { fill: #0a0a0a; }
      .orange-hot { fill: #ff6a00; }
      .white-matte { fill: #f5f5f0; }
      .tech-gray { fill: #888880; }
      .font-brand { font-family: 'Bebas Neue', 'Arial Black', sans-serif; font-size: 84px; letter-spacing: 0.05em; text-anchor: middle; }
      .font-sub { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 16px; letter-spacing: 0.5em; font-weight: 500; text-anchor: middle; }
    </style>
    <!-- Subtle production glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Square Background Box -->
  <rect width="100%" height="100%" class="bg" />

  <!-- CENTERED LOGO ICON (The Aperture / Code Forge) -->
  <!-- Scale boosted for better visibility in square format grids -->
  <g transform="translate(400, 330) scale(2.2)" id="logo-mark">
    <!-- Left Bracket (Code Tag / Clamping Frame) -->
    <path d="M -60,-60 L -10,-60 L -10,-45 L -45,-45 L -45,45 L -10,45 L -10,60 L -60,60 Z" class="white-matte" />
    <!-- Right Bracket (Code Tag / Viewfinder) -->
    <path d="M 60,-60 L 10,-60 L 10,-45 L 45,-45 L 45,45 L 10,45 L 10,60 L 60,60 Z" class="white-matte" />
    
    <!-- Central Focal Element (Aperture Blade core) -->
    <path d="M -25,-30 L 25,-30 L 0,30 Z" class="orange-hot" filter="url(#glow)" />
    
    <!-- Tech Crosshair Accents -->
    <rect x="-2" y="-55" width="4" height="12" class="tech-gray" />
    <rect x="-2" y="43" width="4" height="12" class="tech-gray" />
  </g>

  <!-- STACKED TYPOGRAPHY (Centered) -->
  <!-- Main Brand Heading -->
  <text x="400" y="620" class="white-matte font-brand">FOCAL<tspan class="orange-hot">FORGE</tspan></text>
  
  <!-- Sub-Branding Pipeline info -->
  <text x="404" y="670" class="tech-gray font-sub">STUDIOS — KAMPALA</text>

  <!-- Decorative UI Elements -->
  <line x1="250" y1="710" x2="550" y2="710" stroke="#ff6a00" stroke-width="1.5" stroke-dasharray="6 12" opacity="0.3" />
</svg>
