<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
    <defs>
        <!-- Deep Studio Charcoal Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#11161B"/>
            <stop offset="50%" stop-color="#171D24"/>
            <stop offset="100%" stop-color="#0A0D10"/>
        </linearGradient>

        <!-- Vivid Cyber Neon Orange Gradient -->
        <linearGradient id="neonOrange" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF4500"/>
            <stop offset="60%" stop-color="#FF7300"/>
            <stop offset="100%" stop-color="#FFA500"/>
        </linearGradient>

        <!-- Soft Premium White Metallic Gradient for Typography -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>

        <!-- Subtle Glow Filter for the Neon Monogram -->
        <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background Base Layer -->
    <rect width="100%" height="100%" fill="url(#bgGrad)"/>

    <!-- Subtle Tech Grid Background Accent Lines -->
    <path d="M 10,-50 L -50,10 M 790,300 L 850,240" stroke="#FF7300" stroke-width="0.75" opacity="0.15" stroke-dasharray="4,4"/>
    <path d="M 0,0 L 800,0 M 0,350 L 800,350 M 0,0 L 0,350 M 800,0 L 800,350" stroke="#2C3E50" stroke-width="1" opacity="0.3"/>

    <!-- =================================================== -->
    <!--            THE COMPOSITE BRAND ICON                 -->
    <!-- =================================================== -->
    <!-- Left-aligned Monogram fusing Lens Blades (Cinematography) + Code Brackets (Software) -->
    <g transform="translate(65, 55)">
        <!-- Outer Tech Framing Bracket -->
        <path d="M 40,10 L 15,10 L 15,230 L 40,230" fill="none" stroke="#2C3E50" stroke-width="3" opacity="0.5"/>
        <path d="M 160,10 L 185,10 L 185,230 L 160,230" fill="none" stroke="#2C3E50" stroke-width="3" opacity="0.5"/>

        <!-- The Glowing Core "FF" / Aperture Mesh Structure -->
        <g filter="url(#cyberGlow)">
            <!-- Primary Structural Backbone (First 'F') -->
            <path d="M 45,30 L 135,30 L 135,65 L 85,65 L 85,110 L 125,110 L 125,145 L 85,145 L 85,210 L 45,210 Z" fill="url(#neonOrange)"/>
            
            <!-- Secondary Nested / Interlocking Run (Second 'F') -->
            <path d="M 95,75 L 155,75 L 155,105 L 115,105 L 115,135 L 145,135 L 145,165 L 115,165 L 115,210 L 95,210 Z" fill="url(#neonOrange)" opacity="0.85"/>

            <!-- Cinematography Aspect: Camera Aperture Segment Cuts (Negative Space Overlays) -->
            <path d="M 40,30 L 160,150" stroke="#171D24" stroke-width="4" stroke-linecap="round"/>
            <path d="M 135,30 L 45,120" stroke="#171D24" stroke-width="4" stroke-linecap="round"/>
            <path d="M 45,110 L 155,210" stroke="#171D24" stroke-width="4" stroke-linecap="round"/>

            <!-- Code Engineering Aspect: Neon Inline Code Embed Elements (< > Integration) -->
            <!-- Opening Bracket Cut into the Lower Stem -->
            <path d="M 28,105 L 13,120 L 28,135" fill="none" stroke="url(#neonOrange)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Closing Bracket Cut out to the Right Wing -->
            <path d="M 172,105 L 187,120 L 172,135" fill="none" stroke="url(#neonOrange)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Decorative Precision Calibration Dots -->
        <circle cx="45" cy="15" r="2" fill="#FF7300" opacity="0.7"/>
        <circle cx="155" cy="15" r="2" fill="#FF7300" opacity="0.7"/>
        <circle cx="45" cy="225" r="2" fill="#FF7300" opacity="0.7"/>
        <circle cx="155" cy="225" r="2" fill="#FF7300" opacity="0.7"/>
    </g>

    <!-- =================================================== -->
    <!--                TYPOGRAPHY SYSTEM                    -->
    <!-- =================================================== -->
    
    <!-- Primary Brand Identity Text: FOCALFORGE -->
    <text x="295" y="152" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-weight="900" 
          font-size="62pt" 
          letter-spacing="4px" 
          fill="url(#textGrad)">FOCALFORGE</text>

    <!-- Secondary Structural Hierarchy Text: STUDIOS -->
    <text x="300" y="215" 
          font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
          font-weight="300" 
          font-size="32pt" 
          letter-spacing="19px" 
          fill="#A0AEC0">STUDIOS</text>

    <!-- Sleek High-End Divider Rule Accent -->
    <line x1="300" y1="240" x2="735" y2="240" stroke="url(#neonOrange)" stroke-width="2" opacity="0.8"/>

    <!-- Operational Core Corporate Subtext Tagline -->
    <text x="302" y="270" 
          font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" 
          font-weight="600" 
          font-size="11.5pt" 
          letter-spacing="2.8px" 
          fill="#FF7300" 
          opacity="0.95">CINEMATOGRAPHY • SOFTWARE ENGINEERING</text>
</svg>
