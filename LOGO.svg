<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Dark Surface Background matching website root -->
    <style>
      .bg { fill: #0a0a0a; }
      .orange-hot { fill: #ff6a00; }
      .white-matte { fill: #f5f5f0; }
      .tech-gray { fill: #888880; }
      .font-brand { font-family: 'Bebas Neue', 'Arial Black', sans-serif; font-size: 72px; letter-spacing: 0.06em; }
      .font-sub { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 14px; letter-spacing: 0.45em; font-weight: 500; }
    </style>
    <!-- Subtle glow effect for the forge icon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- LOGO ICON (The Aperture / Code Forge) -->
  <g transform="translate(40, 45)">
    <!-- Outer Code Bracket / Viewfinder Frame -->
    <path d="M 20,20 L 70,20 L 70,35 L 35,35 L 35,125 L 70,125 L 70,140 L 20,140 Z" class="white-matte" />
    <path d="M 140,20 L 90,20 L 90,35 L 125,35 L 125,125 L 90,125 L 90,140 L 140,140 Z" class="white-matte" />
    
    <!-- Central Focal Element (Aperture Blade / Core Piece) -->
    <path d="M 55,50 L 105,50 L 80,110 Z" class="orange-hot" filter="url(#glow)" />
    <!-- Tech Crosshair Accents -->
    <rect x="78" y="25" width="4" height="12" class="tech-gray" />
    <rect x="78" y="123" width="4" height="12" class="tech-gray" />
  </g>

  <!-- TYPOGRAPHY -->
  <!-- Main Brand Name -->
  <text x="230" y="128" class="white-matte font-brand">FOCAL<tspan class="orange-hot">FORGE</tspan></text>
  
  <!-- Sub-branding matching structural elements -->
  <text x="235" y="165" class="tech-gray font-sub">STUDIOS — KAMPALA</text>

  <!-- Decorative UI Scan Line Component -->
  <line x1="235" y1="185" x2="680" y2="185" stroke="#ff6a00" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
</svg>
